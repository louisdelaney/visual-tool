# Builds the site and publishes it to GitHub Pages.
#
# Runs only when started by hand from the Actions tab until Pages is switched on (repository
# Settings → Pages → Source: GitHub Actions). Then add `push: branches: [main]` under `on` to
# publish every change to main.
#
# The backend URL comes from the repository variable API_URL (Settings → Secrets and
# variables → Actions → Variables). Leave it unset and the site sends nothing.
name: Publish to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.API_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
