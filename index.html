<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Form–Motion Coherence Test</title>
  <!-- Dark for everyone, from the first paint, so the page never flashes white while loading. -->
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0C0F0E">
  <!-- Links out and requests to the backend don't say which page they came from. -->
  <meta name="referrer" content="no-referrer">
  <!-- The build adds a Content Security Policy here (see vite.config.ts). -->
</head>
<body>
  <!-- The React app: title, steps and pages. -->
  <div id="app" class="wrap"></div>

  <!-- The full-screen stage the tasks run on. Plain DOM driven by src/stage, outside React, so
       nothing re-renders while stimuli are on screen. -->
  <div class="stage" id="stage" hidden>
    <canvas id="stage-canvas"></canvas>
    <p class="stage-note" id="stage-note" hidden></p>
    <p class="stage-fb" id="stage-fb" hidden></p>
    <div class="stage-msg" id="stage-msg" role="dialog" aria-modal="true" hidden></div>
    <!-- The pause box's words come from src/text (tasks.pause), filled in by src/stage/pause.ts. -->
    <div class="pause-box" id="pause" role="dialog" aria-modal="true" aria-labelledby="pause-h" hidden>
      <h2 id="pause-h"></h2>
      <p></p>
      <div class="msg-actions">
        <button type="button" class="btn" id="pause-resume"></button>
        <button type="button" class="btn secondary" id="pause-end"></button>
      </div>
    </div>
    <p class="hud" id="hud"></p>
  </div>

  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
