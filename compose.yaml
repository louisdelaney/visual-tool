# Docker Compose setup for running the backend against a local Firestore emulator.
#
# Docker is optional: the backend's in-memory mode (`npm run dev` in backend/) needs none of
# this. Use this file to try the real Firestore code path without a Google Cloud project, and
# to run the checks that need the emulator or a browser. The commands in the root package.json
# (backend:up, check:firestore, check:e2e, ...) run these through scripts/remote.sh, so they
# also work on a remote build machine when REMOTE_HOST is set.
#
# Services:
#   firestore     the Firestore emulator (no real data, no credentials).
#   backend       the API on http://localhost:8080, using the emulator.
#   export        (profile "tools") one run of the export job, writing to the export-data volume.
#   backend-test  (profile "checks") the backend's tests, with the emulator available.
#   e2e           (profile "checks") the site's end-to-end browser tests, in Playwright's image.

services:
  firestore:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: gcloud emulators firestore start --host-port=0.0.0.0:8081 --project=demo-visual-tool
    ports:
      - "8081:8081"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      - firestore
    ports:
      - "8080:8080"
    environment:
      BACKEND: firestore
      GOOGLE_CLOUD_PROJECT: demo-visual-tool
      FIRESTORE_EMULATOR_HOST: firestore:8081
      # Stops the Google client probing for a metadata server that isn't there.
      METADATA_SERVER_DETECTION: none
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:5173}
      EXPORT_DIR: /data/export
    volumes:
      - export-data:/data

  export:
    profiles: [tools]
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["node", "dist/jobs/export.js"]
    depends_on:
      - firestore
    environment:
      BACKEND: firestore
      GOOGLE_CLOUD_PROJECT: demo-visual-tool
      FIRESTORE_EMULATOR_HOST: firestore:8081
      # Stops the Google client probing for a metadata server that isn't there.
      METADATA_SERVER_DETECTION: none
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:5173}
      EXPORT_DIR: /data/export
    volumes:
      - export-data:/data

  backend-test:
    profiles: [checks]
    image: node:22-slim
    working_dir: /work
    volumes:
      - .:/work
      - backend-node-modules:/work/backend/node_modules
    environment:
      FIRESTORE_EMULATOR_HOST: firestore:8081
      GOOGLE_CLOUD_PROJECT: demo-visual-tool
      METADATA_SERVER_DETECTION: none
    depends_on:
      - firestore
    command: sh -c "cd backend && npm ci && npm test"

  e2e:
    profiles: [checks]
    # The version must match "playwright" in package.json; bump them together.
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    working_dir: /work
    volumes:
      - .:/work
      - site-node-modules:/work/node_modules
    ipc: host
    command: sh -c "npm ci && npm run test:e2e"

volumes:
  export-data:
  backend-node-modules:
  site-node-modules:
